<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neva - Giriş Yap</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="girisyap.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

     
    <link rel="icon" href="image/favicon.png" type="image/png">

</head>
<body>
        <a href="index.html" class="geri-butonu"><i class="fas fa-arrow-left"></i></a>

    <div class="login-hero">
        <div class="floating-elements">
            <div class="floating-element" style="top: 20%; left: 10%; animation-delay: 0s;"></div>
            <div class="floating-element" style="top: 60%; left: 20%; animation-delay: 2s;"></div>
            <div class="floating-element" style="top: 40%; right: 15%; animation-delay: 4s;"></div>
            <div class="floating-element" style="top: 80%; right: 25%; animation-delay: 1s;"></div>
        </div>

        <div class="auth-container">
            <div class="auth-box">
                <h1>Giriş Yap</h1>
                
                <button class="auth-provider-btn">
                    <span>Google ile Devam Et</span>
                </button>
                
                <button class="auth-provider-btn">
                    <span>Apple ile Devam Et</span>
                </button>
                
                <div class="auth-divider">
                    <span>veya</span>
                </div>
                
                <form class="auth-form" id="loginForm">
                    <input type="email" id="email" placeholder="Email" required>
                    <input type="password" id="password" placeholder="Şifre" required>
                    
                    <a href="sifremiunuttum.html" class="forgot-password">Şifrenizi mi unuttunuz?</a>
                    
                    <button type="submit" class="auth-submit">Giriş Yap</button>
                </form>
                
                <div class="auth-footer">
                    Neva'ya yeni misiniz? <a href="kayitol.html">Hesap oluşturun</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('loginForm');
            
            loginForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const submitBtn = e.target.querySelector('.auth-submit');
                
                // Loading durumu
                const originalText = submitBtn.textContent;
                submitBtn.textContent = 'Giriş yapılıyor...';
                submitBtn.disabled = true;
                
                try {
                    const response = await fetch('https://aiproje.guryeli.com/api/auth/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            email: email,
                            password: password
                        })
                    });
                    
                    const data = await response.json();
                    
                    if (data.success && data.token) {
                        // Token'ı ve kullanıcı bilgilerini localStorage'e kaydet
                        localStorage.setItem('authToken', data.token);
                        localStorage.setItem('userInfo', JSON.stringify(data.user || { email: email }));
                        
                        // Başarılı giriş mesajı
                        alert('Giriş başarılı! Chat sayfasına yönlendiriliyorsunuz...');
                        
                        // Chat menüsüne yönlendir
                        window.location.href = 'chat_menu.html';
                    } else {
                        // Hata mesajı göster
                        alert(data.message || 'Giriş başarısız. Lütfen bilgilerinizi kontrol edin.');
                    }
                    
                } catch (error) {
                    console.error('Giriş hatası:', error);
                    alert('Bağlantı hatası. Lütfen internet bağlantınızı kontrol edin.');
                } finally {
                    // Loading durumunu geri al
                    submitBtn.textContent = originalText;
                    submitBtn.disabled = false;
                }
            });
        });
    </script>
</body>
</html>
