    <style>
        /* Temel layout (varsa external ile çatışmasın) */
      
        /* Ana sohbet bölümü */
        .chat-container {
            display: flex;
            justify-content: center;
            padding: 2rem 1rem;
            min-height: 600px;
        }
        
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-radius: 15px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 900px;
            width: 100%;
        }

        .chat-header {
            display: flex;
            align-items: center;
            padding: 1rem;
            gap: 0.75rem;
        }
        .chat-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00f5ff, #0080ff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            color: #000;
        }
        .chat-info h3 {
            margin: 0;
        }
        .chat-status {
            font-size: 0.85rem;
            color: #0ff;
            margin-top: 2px;
        }

        /* Chat Mode Display Stilleri */
        .chat-mode-display {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .current-mode {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .mode-icon {
            font-size: 1.2rem;
        }
        
        .mode-text {
            font-size: 0.9rem;
            font-weight: 600;
            color: #fff;
        }
        
        .change-mode-btn {
            padding: 0.4rem 0.8rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .change-mode-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .chat-messages {
            flex: 1;
            padding: 1rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            scroll-behavior: smooth;
        }
        .message {
            max-width: 80%;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            position: relative;
            line-height: 1.3;
        }
        .message.ai {
            align-self: flex-start;
            background: linear-gradient(135deg, rgba(0, 245, 255, 0.1), rgba(0, 128, 255, 0.1));
            border: 1px solid rgba(0, 245, 255, 0.2);
            color: #fff;
        }
        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
        }
        
        /* System mesajları için stil */
        .message.system {
            align-self: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 60%;
        }
        
        .message-time {
            font-size: 0.6rem;
            margin-top: 4px;
            opacity: 0.7;
            text-align: right;
        }

        .chat-input {
            display: flex;
            gap: 0.5rem;
            padding: 0.75rem 1rem;
        }
        .chat-input input {
            flex: 1;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border: none;
            outline: none;
            font-size: 1rem;
        }

        .chat-send {
            padding: 0.75rem 1.5rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .chat-send:hover {
            background: linear-gradient(135deg, #764ba2, #667eea);
            transform: translateY(-2px);
        }
       

        /* Scrollbar custom (Webkit) */
        .chat-sidebar::-webkit-scrollbar,
        .chat-messages::-webkit-scrollbar {
            width: 10px;
        }
        .chat-sidebar::-webkit-scrollbar-track,
        .chat-messages::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.02);
            border-radius: 5px;
        }
        .chat-sidebar::-webkit-scrollbar-thumb,
        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.12);
            border-radius: 5px;
        }
        .chat-sidebar::-webkit-scrollbar-thumb:hover,
        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: rgba(255,255,255,0.22);
        }

        /* Responsive küçük ekran */
        @media (max-width: 1000px) {
            .chat-container {
                margin: 1rem;
                min-height: 500px;
            }
            .chat-main {
                max-width: 100% !important;
            }
            .chat-header {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }
            .chat-mode-display {
                margin-left: 0;
                justify-content: center;
            }
        }
    </style>
</head>

                    { type: 'ai', text: 'Harika seçim! İşte 15 dakikalık öz bakım fikirleri:<br><br>🛁 Sıcak duş/banyo<br>☕ Sevdiğiniz çayı içerken derin nefes almak<br>📖 Birkaç sayfa kitap okumak<br>🎵 Müzik dinleyip dans etmek<br>🧘‍♀️ Meditasyon/nefes egzersizi<br>🌸 Cilt bakımı yapmak<br>📱 Telefondan uzak durarak sessizlik<br><br>Hangisi size daha çekici geldi? Unutmayın, bu sizin hakkınız!', time: '11:29' },
                    { type: 'user', text: 'Çay içerken derin nefes almak güzel geldi. Basit ama etkili olabilir.', time: '11:31' },
                    { type: 'ai', text: 'Mükemmel seçim! Basit olan şeyler genellikle en sürdürülebilir olanlardır. İşte küçük ritüeliniz:<br><br>☕ Çayınızı hazırlarken o ana odaklanın<br>🌬️ İlk yudumdan önce derin nefes alın<br>🧘‍♀️ Çayın sıcaklığını, tadını hissedin<br>💭 Bu 15 dakika sadece SİZE ait<br><br>Bu küçük ritüel, zihninizdeki gürültüyü azaltacak ve size değer verdiğinizi hatırlatacak. Bugün deneyebilir misiniz? 🫖💙', time: '11:32' }
                ]
            }
        };

        // Page Load ve Mode Display Güncellemeleri
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Chat Yazili sayfası yüklendi');
            
            // Mode display'i güncelle
            updateChatModeDisplay();
            
            // Token kontrolü
            checkAuthentication();
        });
        
        function updateChatModeDisplay() {
            const chatType = localStorage.getItem('selectedChatType');
            const chatMode = localStorage.getItem('selectedChatMode');
            
            if (chatType && chatMode) {
                const modeIcon = document.querySelector('.mode-icon');
                const modeText = document.querySelector('.mode-text');
                
                if (chatMode === 'friend') {
                    modeIcon.textContent = '🤝';
                    modeText.textContent = 'Arkadaş Modu';
                } else if (chatMode === 'psychological') {
                    modeIcon.textContent = '🧠';
                    modeText.textContent = 'Psikolojik Destek';
                }
                
                console.log(`Chat Mode Display Updated: ${chatType} - ${chatMode}`);
            }
        }
        
        function goBackToMenu() {
            // Chat menüsüne geri dön
            window.location.href = 'chat_menu.html';
        }
        
        function checkAuthentication() {
            const token = localStorage.getItem('authToken');
            if (!token) {
                alert('Lütfen önce giriş yapın.');
                window.location.href = 'girisyap.html';
                return false;
            }
            return true;
        }



        // Mesaj ekleme helper fonksiyonu
        function addMessageToChat(type, text) {
            try {
                console.log('addMessageToChat çağrıldı:', type, text.substring(0, 50) + '...');
                const messagesContainer = document.getElementById('chatMessages');
                if (!messagesContainer) {
                    console.error('chatMessages container bulunamadı!');
                    return null;
                }
                
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${type}`;
                
                const time = new Date().toLocaleTimeString('tr-TR', { 
                    hour: '2-digit', 
                    minute: '2-digit' 
                });
                
                messageDiv.innerHTML = `
                    <div>${text}</div>
                    <div class="message-time">${time}</div>
                `;
                
                messagesContainer.appendChild(messageDiv);
                console.log('Mesaj eklendi, toplam mesaj sayısı:', messagesContainer.children.length);
                
                // Scroll to bottom - güvenli şekilde
                setTimeout(() => {
                    try {
                        messagesContainer.scrollTop = messagesContainer.scrollHeight;
                        console.log('Scroll yapıldı');
                    } catch (scrollError) {
                        console.error('Scroll hatası:', scrollError);
                    }
                }, 50);
                
                return messageDiv; // Loading mesajı için geri döndür
                
            } catch (error) {
                console.error('addMessageToChat hatası:', error);
                return null;
            }
        }

        // Sayfa yüklendiğinde token kontrolü
        function checkAuthOnLoad() {
            const token = localStorage.getItem('authToken');
            console.log('🔐 Token kontrolü:', token ? 'Token mevcut' : 'Token YOK');
            if (!token) {
                console.log('🚨 Token bulunamadı - giriş sayfasına yönlendiriliyor');
                alert('Bu sayfaya erişim için giriş yapmalısınız.');
                // GEÇICI OLARAK REDIRECT'İ DEVRE DIŞI BIRAKALIM
                console.log('🚨 REDIRECT DEVRE DIŞI - Test için');
                // window.location.href = 'girisyap.html';
                return false;
            }
            return true;
        }

        // Kullanıcı bilgisini göster
        function showUserInfo() {
            const userInfo = localStorage.getItem('userInfo');
            const userWelcome = document.getElementById('userWelcome');
            
            if (userInfo && userWelcome) {
                try {
                    const user = JSON.parse(userInfo);
                    userWelcome.textContent = `Hoş geldin, ${user.username || user.name || 'Kullanıcı'}!`;
                } catch (e) {
                    console.log('User info parse error:', e);
                }
            }
        }

        async function sendMessage() {
            try {
                console.log('🚀 sendMessage başladı');
                const input = document.getElementById('messageInput');
                const text = input.value.trim();
                if (!text) return;

                // Token kontrolü ekle
                const token = localStorage.getItem('authToken');
                console.log('🔍 Token durumu:', token ? `Token mevcut: ${token.substring(0, 20)}...` : 'TOKEN YOK!');
                if (!token) {
                    console.log('🚨 TOKEN BULUNAMADI - Giriş sayfasına yönlendiriliyor');
                    alert('Lütfen giriş yapın!');
                    window.location.href = 'girisyap.html';
                    return;
                }

                // localStorage'dan seçili modu al
                const selectedMode = localStorage.getItem('selectedChatMode') || 'friend';
                console.log('🎯 Mesaj gönderilirken kullanılan mod:', selectedMode);

                // Kullanıcı mesajını hemen göster
                console.log('📝 Kullanıcı mesajı ekleniyor:', text);
                addMessageToChat('user', text);
                input.value = '';

                // Loading mesajı göster
                console.log('⏳ Loading mesajı ekleniyor...');
                const loadingDiv = addMessageToChat('ai', 'Düşünüyorum... ⏳');

                console.log('🌐 API çağrısı başlıyor...');
                const response = await fetch('https://nevapi.guryeli.com/chat/text', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        message: text,
                        mode: selectedMode
                    })
                });

                // Loading mesajını kaldır
                console.log('🗑️ Loading mesajı kaldırılıyor...');
                if (loadingDiv) {
                    loadingDiv.remove();
                }

                console.log('📊 Response status:', response.status);
                
                if (!response.ok) {
                    console.log('❌ Response not OK:', response.status, response.statusText);
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                console.log('📦 API cevabı alındı:', data);
                
                // AI cevabını göster
                if (data.reply_text) {
                    console.log('🤖 AI cevabı ekleniyor:', data.reply_text.substring(0, 50) + '...');
                    addMessageToChat('ai', data.reply_text);
                    console.log('✅ AI cevabı başarıyla eklendi');
                } else {
                    console.log('⚠️ reply_text bulunamadı, hata mesajı ekleniyor');
                    addMessageToChat('ai', 'Üzgünüm, bir sorun oluştu. Lütfen tekrar deneyin.');
                }
                
                console.log('🎉 sendMessage başarıyla tamamlandı - sayfa YENİLENMEMELİ!');
                
            } catch (error) {
                console.error('💥 KRITIK HATA sendMessage\'da:', error);
                console.error('💥 Error stack:', error.stack);
                alert('Bir hata oluştu, sayfa yenilenecek!');
            }
        }

        // Global error handler
        window.addEventListener('error', function(e) {
            console.error('🚨 GLOBAL JavaScript HATASI:', e.error);
            console.error('Dosya:', e.filename, 'Satır:', e.lineno);
        });

        window.addEventListener('unhandledrejection', function(e) {
            console.error('🚨 YAKALANMAYAN PROMISE HATASI:', e.reason);
        });

        // Initialize everything safely
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🔥 Sayfa yüklendi - DOMContentLoaded tetiklendi');
            
            // Sayfa yenilenme tespiti
            window.addEventListener('beforeunload', function(e) {
                console.log('⚠️ SAYFA YENİLENİYOR! beforeunload tetiklendi');
            });
            
            // İlk önce token kontrolü yap
            if (!checkAuthOnLoad()) {
                return;
            }
            
            // Kullanıcı bilgisini göster
            showUserInfo();
            
            try {
                // loadChat('anxiety'); // BU SATIRI KALDIRIN - Gerçek API kullanırken çağrılmamalı

                const messageInput = document.getElementById('messageInput');
                const chatForm = document.getElementById('chatForm');
                
                if (chatForm) {
                    chatForm.addEventListener('submit', function(e) {
                        console.log('📝 Form submit tetiklendi - engellenecek');
                        e.preventDefault();
                        sendMessage();
                        return false;
                    });
                }
                
                if (messageInput) {
                    messageInput.addEventListener('keypress', function(e) {
                        if (e.key === 'Enter') {
                            console.log('⌨️ Enter tuşu basıldı - engellenecek');
                            e.preventDefault(); // Form submit'i engelle
                            sendMessage();
                        }
                    });
                }

                const observerOptions = {
                    threshold: 0.1,
                    rootMargin: '0px 0px -50px 0px'
                };

                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting && entry.target.classList) {
                            entry.target.classList.add('fade-in');
                        }
                    });
                }, observerOptions);

                document.querySelectorAll('.fade-in').forEach(el => {
                    observer.observe(el);
                });

                // Sayfa yüklendiğinde karşılama mesajını ekle
                console.log('🎯 Karşılama mesajı ekleniyor...');
                addWelcomeMessage();

            } catch (error) {
                console.log('Initialization error:', error);
            }
        });
        
        // Karşılama mesajı ekleme
        function addWelcomeMessage() {
            const chatType = localStorage.getItem('selectedChatType');
            const chatMode = localStorage.getItem('selectedChatMode');
            
            let welcomeMessage = '';
            
            if (chatMode === 'friend') {
                welcomeMessage = 'Merhaba! Ben Neva, yapay zeka destekli arkadaşın. Seninle sohbet etmeye hazırım! Bugün nasılsın? 😊';
            } else if (chatMode === 'psychological') {
                welcomeMessage = 'Merhaba! Ben Neva, yapay zeka destekli psikolojik destek asistanınız. Size nasıl yardımcı olabilirim? 🧠💙';
            }
            
            if (welcomeMessage) {
                addMessageToChat('ai', welcomeMessage);
                console.log(`Welcome message added for mode: ${chatMode}`);
            }
        }
    </script>
</body>
